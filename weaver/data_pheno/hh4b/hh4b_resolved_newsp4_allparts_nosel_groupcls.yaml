### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `awkward` in the expression
#   1) trigger selection: require at least 3 of the 4 triggered AK4 jets b-tag discr > 0.0243 (LP, new SophonAK4)
selection: >-
   (gen_dihiggs_mass > -1)

# test_time_selection: >-
#    (gen_dihiggs_mass > -1)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   part_pt: np.hypot(part_px, part_py)
   part_pt_log: np.log(part_pt)
   part_e_log: np.log(part_energy)
   part_logptrel: np.log(part_pt/pfcand_sum_pt)
   part_logerel: np.log(part_energy/pfcand_sum_energy)
   part_deltaR: np.hypot(part_deta, part_dphi)
   part_d0: np.tanh(part_d0val)
   part_dz: np.tanh(part_dzval)
   part_isElectron: (part_pid == 11) | (part_pid == -11)
   part_isMuon: (part_pid == 13) | (part_pid == -13)
   part_isPhoton: part_pid == 22
   part_isNeutralHadron: (part_charge == 0) & (part_pid != 22)
   part_isChargedHadron: (part_charge != 0) & ~part_isElectron & ~part_isMuon

   part_mask: ak.ones_like(part_energy)

   # labels
   gen_higgs1_mass_label: >-   
      ak.where((gen_higgs1_mass==0), 33, (gen_higgs1_mass-37.5)//5)
   gen_higgs2_mass_label: >-
      ak.where((gen_higgs2_mass==0), 33, (gen_higgs2_mass-37.5)//5)

   is_sg: (gen_higgs1_mass>0) & (gen_higgs2_mass>0)
   is_qcd: (gen_higgs1_mass==0) | (gen_higgs2_mass==0)
   # labels
   # is_hh4b: gen_dihiggs_mass > 0
   # is_qcd: gen_dihiggs_mass == 0

preprocess:
  ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
  method: manual
  ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
  data_fraction: 0.5

inputs:
   pf_points:
      length: 256
      pad_mode: wrap
      vars: 
         - [part_eta, null]
         - [part_phi, null]
   pf_features:
      length: 256
      pad_mode: wrap
      vars: 
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
         - [part_pt_log, 1.7, 0.7]
         - [part_e_log, 2.0, 0.7]
         - [part_logptrel, -4.7, 0.7]
         - [part_logerel, -4.7, 0.7]
         - [part_deltaR, 0.2, 4.0]
         - [part_charge, null]
         - [part_isChargedHadron, null]
         - [part_isNeutralHadron, null]
         - [part_isPhoton, null]
         - [part_isElectron, null]
         - [part_isMuon, null]
         - [part_d0, null]
         - [part_d0err, 0, 1, 0, 1]
         - [part_dz, null]
         - [part_dzerr, 0, 1, 0, 1]
         - [part_deta, null]
         - [part_dphi, null]
         - [part_eta, null]
         - [part_phi, null]
   pf_vectors:
      length: 256
      pad_mode: wrap
      vars: 
         - [part_px, null]
         - [part_py, null]
         - [part_pz, null]
         - [part_energy, null]
   pf_mask:
      length: 256
      pad_mode: constant
      vars: 
         - [part_mask, null]

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   type: custom
   value: 
      truth_label_0: gen_higgs1_mass_label
      truth_label_1: gen_higgs2_mass_label
      truth_label_2: is_qcd 
   #0-signal 1-QCD
