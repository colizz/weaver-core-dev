### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `awkward` in the expression
#   1) trigger selection: require at least 3 of the 4 triggered AK4 jets b-tag discr > 0.0557 (LP)
selection: >-
   (ak.sum(jet_sophonAK4_probB[np.abs(jet_eta) < 2.5][:, :4] > 0.0557, axis=1) >= 3)

# test_time_selection: >-
#    (gen_dihiggs_mass > -1)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   hcand4jet_inds: ak.argsort(jet_sophonAK4_probB[(jet_pt > 30.) & (np.abs(jet_eta) < 2.5)], axis=1, ascending=False)[:, :4]
   hcand4jet_p4: _p4_from_ptetaphie(jet_pt[hcand4jet_inds], jet_eta[hcand4jet_inds], jet_phi[hcand4jet_inds], jet_energy[hcand4jet_inds])
   hcand4jet_px: hcand4jet_p4.x
   hcand4jet_py: hcand4jet_p4.y
   hcand4jet_pz: hcand4jet_p4.z
   hcand4jet_energy: hcand4jet_p4.t
   hcand4jet_pt_log: np.log(jet_pt[hcand4jet_inds])
   hcand4jet_energy_log: np.log(jet_energy[hcand4jet_inds])
   hcand4jet_isbtagMP: jet_sophonAK4_probB[hcand4jet_inds] > 0.297
   hcand4jet_mask: ak.ones_like(hcand4jet_px)

   # labels
   is_hh4b: gen_dihiggs_mass > 0
   is_qcd: gen_dihiggs_mass == 0

preprocess:
  ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
  method: manual
  ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
  data_fraction: 0.5

inputs:
   pf_points:
      length: 4
      pad_mode: wrap
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
      vars: 
         - [hcand4jet_px, null] # this is dummy inputs
   pf_features:
      length: 4
      pad_mode: wrap
      vars: 
         - [hcand4jet_pt_log, 4., 1.]
         - [hcand4jet_energy_log, 4., 1.]
         - hcand4jet_isbtagMP
   pf_vectors:
      length: 4
      pad_mode: wrap
      vars: 
         - [hcand4jet_px, null]
         - [hcand4jet_py, null]
         - [hcand4jet_pz, null]
         - [hcand4jet_energy, null]
   pf_mask:
      length: 4
      pad_mode: constant
      vars: 
         - [hcand4jet_mask, null]

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   type: simple
   value: [is_hh4b, is_qcd]
