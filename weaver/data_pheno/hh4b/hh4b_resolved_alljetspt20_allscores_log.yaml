### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `awkward` in the expression
#   1) trigger selection: require at least 3 of the 4 triggered AK4 jets b-tag discr > 0.0557 (LP)
selection: >-
   (ak.sum(jet_sophonAK4_probB[np.abs(jet_eta) < 2.5][:, :4] > 0.0557, axis=1) >= 3)

# test_time_selection: >-
#    (gen_dihiggs_mass > -1)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   goodjet_flag: (jet_pt > 20.) & (np.abs(jet_eta) < 2.5)
   goodjet_p4: _p4_from_ptetaphie(jet_pt[goodjet_flag], jet_eta[goodjet_flag], jet_phi[goodjet_flag], jet_energy[goodjet_flag])
   goodjet_px: goodjet_p4.x
   goodjet_py: goodjet_p4.y
   goodjet_pz: goodjet_p4.z
   goodjet_energy: goodjet_p4.t
   goodjet_pt_log: np.log(jet_pt[goodjet_flag])
   goodjet_energy_log: np.log(jet_energy[goodjet_flag])
   goodjet_sophonAK4_probB: jet_sophonAK4_probB[goodjet_flag]
   goodjet_sophonAK4_probC: jet_sophonAK4_probC[goodjet_flag]
   goodjet_sophonAK4_probL: jet_sophonAK4_probL[goodjet_flag]
   goodjet_sophonAK4_probB_log: np.log(np.maximum(goodjet_sophonAK4_probB, 1e-20))
   goodjet_sophonAK4_probC_log: np.log(np.maximum(goodjet_sophonAK4_probC, 1e-20))
   goodjet_sophonAK4_probL_log: np.log(np.maximum(goodjet_sophonAK4_probL, 1e-20))
   goodjet_mask: ak.ones_like(goodjet_px)

   # labels
   is_hh4b: gen_dihiggs_mass > 0
   is_qcd: gen_dihiggs_mass == 0

preprocess:
  ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
  method: manual
  ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
  data_fraction: 0.5

inputs:
   pf_points:
      length: 10
      pad_mode: wrap
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
      vars: 
         - [goodjet_px, null] # this is dummy inputs
   pf_features:
      length: 10
      pad_mode: wrap
      vars: 
         - [goodjet_pt_log, 4., 1.]
         - [goodjet_energy_log, 4., 1.]
         - [goodjet_sophonAK4_probB_log, -4., 0.5]
         - [goodjet_sophonAK4_probC_log, -4., 0.5]
         - [goodjet_sophonAK4_probL_log, -4., 0.5]
   pf_vectors:
      length: 10
      pad_mode: wrap
      vars: 
         - [goodjet_px, null]
         - [goodjet_py, null]
         - [goodjet_pz, null]
         - [goodjet_energy, null]
   pf_mask:
      length: 10
      pad_mode: constant
      vars: 
         - [goodjet_mask, null]

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   type: simple
   value: [is_hh4b, is_qcd]
